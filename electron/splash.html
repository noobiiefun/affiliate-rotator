<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width: 460px; height: 280px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: transparent;
    -webkit-app-region: drag;
  }

  .card {
    width: 460px; height: 280px;
    background: linear-gradient(145deg, #0f1117 0%, #1a1a2e 50%, #16213e 100%);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    box-shadow: 0 24px 64px rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
  }

  /* Background glow */
  .card::before {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
    top: -80px; left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
  }

  .logo {
    width: 68px; height: 68px;
    background: linear-gradient(135deg, #16a34a, #15803d);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    box-shadow: 0 8px 24px rgba(22,163,74,0.4);
    margin-bottom: 16px;
    animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.3px;
    margin-bottom: 4px;
  }

  .sub {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 32px;
  }

  .status-wrap {
    width: 280px;
    text-align: center;
  }

  .status {
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    margin-bottom: 10px;
    min-height: 18px;
    transition: opacity 0.3s;
  }

  .bar-track {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #8b5cf6, #6366f1, #3b82f6);
    background-size: 200% 100%;
    animation: slide 1.5s linear infinite;
    width: 40%;
  }

  .version {
    position: absolute;
    bottom: 14px;
    right: 16px;
    font-size: 10px;
    color: rgba(255,255,255,0.2);
  }

  @keyframes pop {
    from { transform: scale(0.7); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  @keyframes slide {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">📺</div>
  <h1>Affiliate Rotator</h1>
  <p class="sub">QR Rotator untuk OBS Livestreaming</p>

  <div class="status-wrap">
    <p class="status" id="statusText">Memulai aplikasi...</p>
    <div class="bar-track">
      <div class="bar-fill" id="bar"></div>
    </div>
  </div>

  <p class="version">v1.0.0</p>
</div>

<script>
  const { ipcRenderer } = require('electron')

  ipcRenderer.on('status', (_, msg) => {
    document.getElementById('statusText').textContent = msg
  })

  ipcRenderer.on('error', (_, msg) => {
    document.getElementById('statusText').textContent = '❌ Error: ' + msg
    document.getElementById('statusText').style.color = '#f87171'
    document.getElementById('bar').style.background = '#ef4444'
    document.getElementById('bar').style.animation = 'none'
    document.getElementById('bar').style.width = '100%'
  })
</script>
</body>
</html>
